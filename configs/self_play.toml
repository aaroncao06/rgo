# Example local CPU run. Paths are relative to the process working directory;
# this example assumes you run from the repository root.
# Create models/ first, then atomically publish <version>.onnx files into it.
worker_threads = 2
workers_per_thread = 4
output_dir = "self_play_chunks"

# Use { mode = "fixed_records", records = 25000 } to batch across games.
chunk = { mode = "per_game" }

[inference]
model_dir = "models"
cache_capacity = 65536
num_cache_shards = 16

# Each entry starts one executor. base_batch_size counts 19x19 positions;
# smaller boards scale by area: floor(base_batch_size * 361 / board_dim^2).
# A limit of 8 allows up to 35 positions at 9x9, 17 at 13x13, or 8 at 19x19.
# Executors launch immediately with the available requests, even below the limit.
[[inference.executors]]
base_batch_size = 8
# ONNX Runtime CPU threads per operator, also used for GPU fallback (default: 1).
intra_threads = 1
device = { type = "cpu" }
# CUDA alternative (build with --features cuda):
# device = { type = "cuda", device_id = 0 }

