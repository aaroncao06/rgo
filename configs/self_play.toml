# Example local CPU run. Paths are relative to the process working directory;
# this example assumes you run from the repository root.
# Create models/ first, then atomically publish <version>.onnx files into it.
worker_threads = 2
workers_per_thread = 4
output_dir = "self_play_chunks"

# Use { mode = "fixed_records", records = 25000 } to batch across games.
chunk = { mode = "per_game" }

[inference]
model_dir = "models"
cache_capacity = 65536
num_cache_shards = 16

# Each entry starts one executor. Batch size is configured per device.
[[inference.executors]]
max_batch_size = 8
device = { type = "cpu", intra_threads = 1 }
# CUDA alternative (build with --features cuda):
# device = { type = "cuda", device_id = 0 }

# Omit these tables to use the same defaults defined in Rust.
# Individual fields may be overridden without restating the other defaults.
