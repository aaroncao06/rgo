# Local coordination and shared artifact storage.
listen = "127.0.0.1:3434"
data_dir = "data"

[checkpoints]
# Keep every accepted trainer checkpoint for experiment history.
prune_old_checkpoints = false

[replay]
capacity_records = 5_000_000
window_records = 250_000
# Keep evicted source chunks for later experiments while sampling only the active window.
prune_old_chunks = false
sample_group_records = 200_000
sample_groups_per_shard = 4
records_per_shard = 100_000
