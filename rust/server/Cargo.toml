[package]
name = "rgo-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
npyz = { version = "0.9", features = ["half"] }
rand = { version = "0.10", default-features = false }
rgo-artifacts = { path = "../artifacts" }
rgo-fs = { path = "../fs" }
rgo-protocol = { path = "../protocol" }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = "3.27"
zip = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["process"] }
