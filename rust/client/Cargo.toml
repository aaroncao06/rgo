[package]
name = "rgo-client"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
rgo-artifacts = { path = "../artifacts" }
rgo-fs = { path = "../fs" }
rgo-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["test-util"] }
