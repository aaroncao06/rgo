[package]
name = "rgo-protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
rgo-artifacts = { path = "../artifacts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["io-util", "macros", "signal"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt"] }
